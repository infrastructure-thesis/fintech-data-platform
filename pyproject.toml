[project]
name = "fintech-data-platform"
version = "0.1.0"
description = "Production settlement data pipeline"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=85"

[tool.mypy]
python_version = "3.14"
strict = true

[project.scripts]
settlement-pipeline = "src.cli:main"

[tool.coverage.run]
omit = [
    "src/kafka_consumer_loop.py",
    "src/cache/redis_cache.py",  # Add this line
]

[[tool.mypy.overrides]]
module = "clickhouse_driver.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[tool.mypy]
exclude = [
    "src/cache/redis_cache.py",
]
